version: '3.9'

services:
  app:
    build: .
    container_name: maths_mantras_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/maths_mantras
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_session_secret}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

  mongo:
    image: mongo:7-jammy
    container_name: maths_mantras_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads_data:
